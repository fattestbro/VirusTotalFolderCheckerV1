name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name VirusTotalFolderChecker src/virus_checker.py

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/VirusTotalFolderChecker.exe release/VirusTotalFolderChecker.exe
          Copy-Item README.md release/README.md
          Copy-Item settings.example.json release/settings.example.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirusTotalFolderChecker-Windows
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VirusTotalFolderChecker-Windows
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/VirusTotalFolderChecker.exe \
            release/README.md \
            release/settings.example.json \
            --repo "${{ github.repository }}" \
            --title "VirusTotal Folder Checker ${{ github.ref_name }}" \
            --generate-notes
